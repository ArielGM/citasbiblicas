<!--
THESIS: Un control de cabina convierte una referencia en una lámina de proyección, sin pantallas ni pasos extra.
OWN-WORLD: Azul de sala oscura, ámbar de señal y una lámina negra que habla el lenguaje de una salida de video.
STORY: El operador ingresa una cita, confirma el texto y descarga su PNG para vMix.
FIRST VIEWPORT: Formulario compacto a la izquierda y la lámina exportable a la derecha, con la acción principal siempre visible.
FORM: Herramienta operativa de dos paneles; la previsualización es la pieza central.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consulta pasajes Reina-Valera 1909 y descárgalos como PNG para vMix." />
    <title>Pasaje a PNG</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Generador de pasajes">
        <aside class="controls-panel">
          <header class="topbar">
            <div class="brand"><span>TU REFERENCIA PARA PRESENTACIÓN</span></div>
          </header>
          <form id="reference-form">
            <label class="sr-only" for="reference">Referencia bíblica</label>
            <div class="input-row">
              <div class="reference-autocomplete">
                <input id="reference" name="reference" type="text" value="Mateo 5:3-12" autocomplete="off" spellcheck="false" aria-describedby="reference-help" aria-autocomplete="list" aria-controls="book-suggestions" aria-expanded="false" />
                <div id="book-suggestions" class="book-suggestions" role="listbox" aria-label="Libros bíblicos sugeridos" hidden></div>
              </div>
              <button type="submit" id="search-button">Buscar</button>
            </div>
            <p id="reference-help" class="help">Ejemplos: Mateo 12 · Mateo 12:1 · Mateo 12:1-3 · Mateo 12:1,5-8 · Mateo 12:3,4 y 7.</p>
            <div class="version-field">
              <span id="version-label">Versión bíblica</span>
              <div class="version-picker">
                <button id="bible-version-trigger" class="version-trigger" type="button" aria-labelledby="version-label bible-version-text" aria-haspopup="listbox" aria-controls="bible-version-options" aria-expanded="false" disabled>
                  <span id="bible-version-text">Cargando versiones…</span><span class="dropdown-arrow" aria-hidden="true">⌄</span>
                </button>
                <div id="bible-version-options" class="version-options" role="listbox" aria-label="Versiones bíblicas" hidden></div>
              </div>
              <select id="bible-version" class="sr-only" disabled tabindex="-1" aria-hidden="true">
                <option>Cargando versiones en español…</option>
              </select>
            </div>
          </form>

          <div class="appearance" aria-label="Personalización de la lámina">
            <label class="color-field" for="background-color">Fondo <input id="background-color" type="color" value="#05070b" /></label>
            <label class="color-field" for="text-color">Texto <input id="text-color" type="color" value="#ffffff" /></label>
            <div class="font-field">
              <span id="font-label">Tipografía</span>
              <div class="font-picker">
                <button id="font-family-trigger" class="font-trigger" type="button" aria-labelledby="font-label font-family-text" aria-haspopup="listbox" aria-controls="font-family-options" aria-expanded="false">
                  <span id="font-family-text">Manrope · minimalista</span><span class="dropdown-arrow" aria-hidden="true">⌄</span>
                </button>
                <div id="font-family-options" class="font-options" role="listbox" aria-label="Tipografías" hidden></div>
              </div>
              <select id="font-family" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="manrope">Manrope · minimalista</option>
                <option value="cormorant">Cormorant · clásica</option>
              </select>
            </div>
            <label class="toggle"><input id="transparent-bg" type="checkbox" /> Fondo transparente</label>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
        </aside>

        <section class="preview-section" aria-label="Previsualización del pasaje">
          <article id="verse-card" class="verse-card" aria-live="polite">
            <div class="card-content">
              <p id="verse-reference" class="verse-reference">Mateo 5:3–12</p>
              <p id="verse-text" class="verse-text">Cargando pasaje…</p>
              <p id="verse-version" class="verse-version">REINA-VALERA 1909</p>
            </div>
          </article>
          <nav class="carousel-controls" aria-label="Navegación entre láminas">
            <button id="previous-slide" class="carousel-button" type="button" aria-label="Lámina anterior">←</button>
            <div id="slide-dots" class="slide-dots" aria-live="polite"></div>
            <button id="next-slide" class="carousel-button" type="button" aria-label="Lámina siguiente">→</button>
          </nav>
          <button id="download-button" class="download-button" type="button">Descargar (1 PNG)</button>
          <button id="download-ppt-button" class="ppt-button" type="button">Descargar PPTX (1 diapos.)</button>
          <p id="download-note" class="sr-only"></p>
        </section>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
    <script src="app.js"></script>
  </body>
</html>
